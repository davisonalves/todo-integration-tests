services:
  app:
    container_name: todo-app
    build:
      context: ../todo-app
    environment:
      PORT: 3000
      DATABASE_URL: postgres://todo:todo@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/tasks').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  db:
    container_name: todo-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  integration-tests:
    container_name: todo-integration-tests
    build: .
    command: ["sh", "-c", "npx jest --runInBand $$JEST_TEST_FILES"]
    environment:
      BASE_URL: http://app:3000
      JEST_TEST_FILES: ${JEST_TEST_FILES:-}
    depends_on:
      app:
        condition: service_healthy
